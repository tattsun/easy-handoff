[package]
name = "easy-handoff"
version = "0.2.0"
edition = "2024"
description = "Connect/disconnect Bluetooth audio (e.g. AirPods) from the Windows tray with one click"
repository = "https://github.com/tattsun/easy-handoff"
license = "MIT"

[dependencies]
tray-icon = "0.25.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Properties", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = true
strip = true
codegen-units = 1
